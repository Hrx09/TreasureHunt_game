<body>

<div class="stage">
  <div class="masthead">

    <div>

      <p>a journal of jungles, beaches, and questionable decisions</p>
    </div>
  </div>

  <div class="map-card">
    <div class="journal" id="journal" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </div>
</div>

<script>
  const journal = document.getElementById('journal');
  const actions = document.getElementById('actions');

  function log(text, cls = 'narrator'){
    const div = document.createElement('div');
    div.className = 'entry ' + cls;
    div.textContent = text;
    journal.appendChild(div);
    journal.scrollTop = journal.scrollHeight;
  }

  function clearActions(){
    actions.innerHTML = '';
  }

  function askYesNo(question, yesLabel = 'Yes', noLabel = 'No'){
    log(question, 'question');
    return new Promise((resolve) => {
      clearActions();
      const yes = document.createElement('button');
      yes.className = 'btn';
      yes.textContent = yesLabel;
      const no = document.createElement('button');
      no.className = 'btn secondary';
      no.textContent = noLabel;

      yes.onclick = () => { clearActions(); log(yesLabel, 'answer'); resolve(true); };
      no.onclick = () => { clearActions(); log(noLabel, 'answer'); resolve(false); };

      actions.appendChild(yes);
      actions.appendChild(no);
    });
  }

  function askChoice(question, options){
    // options: [{label, value}]
    log(question, 'question');
    return new Promise((resolve) => {
      clearActions();
      options.forEach((opt) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.textContent = opt.label;
        b.onclick = () => { clearActions(); log(opt.label, 'answer'); resolve(opt.value); };
        actions.appendChild(b);
      });
    });
  }

  function askText(question, { placeholder = '', hint = '', numeric = false } = {}){
    log(question, 'question');
    return new Promise((resolve) => {
      clearActions();

      const row = document.createElement('div');
      row.className = 'text-row';

      const input = document.createElement('input');
      input.type = numeric ? 'number' : 'text';
      input.placeholder = placeholder;

      const submit = document.createElement('button');
      submit.className = 'btn';
      submit.textContent = 'Bata';

      function go(){
        const val = input.value.trim();
        clearActions();
        log(val || '(...)', 'answer');
        resolve(val);
      }

      submit.onclick = go;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });

      row.appendChild(input);
      row.appendChild(submit);
      actions.appendChild(row);

      if (hint){
        const h = document.createElement('div');
        h.className = 'hint';
        h.textContent = hint;
        actions.appendChild(h);
      }

      setTimeout(() => input.focus(), 30);
    });
  }

  function showDone(){
    clearActions();
    const row = document.createElement('div');
    row.className = 'done-row';
    row.textContent = 'The adventure rests here for now, explorer.';
    actions.appendChild(row);
  }

  async function gameOver(message){
    log(message, 'doom');
    log('Game Over! Thanks for playing', 'doom');
  }

  async function treasurePuzzle(){
    const target = Math.floor(Math.random() * 50);
    let attempts = 7;

    const start = await askYesNo('Would you like to begin? This is a once-in-a-lifetime opportunity.');
    if (!start){
      await gameOver('You have abandoned the game after coming this far. The game has ended.');
      return;
    }

    while (attempts > 0){
      const guessStr = await askText('Consider carefully and state your guess.', {
        placeholder: 'type a number 0-49',
        hint: `attempts left: ${attempts}`,
        numeric: true
      });
      const guess = Number(guessStr);

      if (guess === target){
        log('Congratulations, you have won! 🥳', 'win');
        return;
      } else if (guess > target){
        log('Guess lower.');
      } else {
        log('Guess higher.');
      }
      attempts--;
    }

    if (attempts <= 0){
      await gameOver('Fortune was not on your side. Having come this far, the game has ended.');
    }
  }

  async function junglePath(){
    log('🌲 You enter the jungle. There is no need to be afraid.');

    const trapped = Math.floor(Math.random() * 10);
    if (trapped % 2 === 0){
      log('You are remarkably fortunate. 😅');
      log('😮 You escaped a hidden trap!');

      const tool = await askChoice('You have the option to get a tool, choose between:', [
        { label: 'Knife', value: 'knife' },
        { label: 'Torch', value: 'torch' },
        { label: 'Stick', value: 'stick' }
      ]);

      switch (tool){
        case 'knife':
          log('The bear has retreated in fear.');
          log('Let us proceed. There is a cave ahead containing treasure — open it.');
          await treasurePuzzle();
          break;
        case 'torch':
          log('Look, there is a path ahead. Run.');
          log('The bear is approaching quickly. Run — there is a cave up ahead.');
          await treasurePuzzle();
          break;
        case 'stick':
          await gameOver('You have made a grave error.');
          break;
      }
    } else {
      await gameOver('You have fallen. Farewell.');
    }
  }

  async function beachPath(){
    log('🏖️ You walk along the beach. It is a beautiful place.');

    const foundBottle = Math.floor(Math.random() * 10);
    if (foundBottle % 2 === 0){
      log('🍾 You found a message in a bottle!');

      const readMessage = await askYesNo('Do you want to read the message?');
      if (readMessage){
        log("📜 The message says: 'Dig where the palm tree shadow falls at noon'");

        const dig = await askYesNo('Do you want to dig there?');
        if (dig){
          const digSpot = await askChoice('Choose a spot to dig:', [
            { label: 'Left of palm tree', value: 1 },
            { label: 'Right of palm tree', value: 2 },
            { label: 'Under the palm tree', value: 3 }
          ]);

          if (digSpot === 2){
            log('🎉 You found a treasure chest!');
            await treasurePuzzle();
          } else {
            await gameOver('❌ You dug in the wrong spot. A crab has bitten you.');
          }
        } else {
          await gameOver('You have missed your opportunity.');
        }
      } else {
        await gameOver('You lack curiosity.');
      }
    } else {
      log('🌊 A big wave is coming!');
      const run = await askYesNo('Do you want to run?');
      if (run){
        log('😅 You escaped the wave! However, you have returned to the beginning.');
        await welcome();
      } else {
        await gameOver('🌊 The wave has carried you away. Farewell.');
      }
    }
  }

  async function welcome(){
    log('🏴‍☠️ Welcome to Treasure Hunter: The Lost Island');

    const name = await askText('What is your name, explorer?', { placeholder: 'your name' });
    log(`Good luck! Let us begin, ${name || 'explorer'}.`);

    const enterIsland = await askYesNo('You see a dangerous island. Do you want to enter?');
    if (enterIsland){
      const choice = await askChoice('Choose your path:', [
        { label: 'Jungle', value: 'jungle' },
        { label: 'Beach', value: 'beach' }
      ]);
      if (choice === 'jungle') await junglePath();
      else await beachPath();
    } else {
      log('You have chosen caution over adventure.');
    }
  }

  async function mainLoop(){
    while (true){
      const startGame = await askYesNo('Shall we begin the game?', 'Begin', 'Decline');
      if (startGame){
        await welcome();
      } else {
        log('Very well. Goodbye.');
        break;
      }
    }
    showDone();
  }

  mainLoop();
</script>
